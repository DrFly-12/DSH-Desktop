<style>

<body data-page-node-id="f2HF9aUsmmHrIYYpFLUYbC">
<div class="container" data-page-node-id="m7o0Oaeh26LcwmuHBrWlaj">
  <div class="logo" data-page-node-id="ELh1rALDxV1lg41wUA7gHi">
    <svg viewBox="0 0 24 24" data-page-node-id="w8z2bAmlbFtFm3IlTSKzj2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" data-page-node-id="BcLIdb0xF5ZWse0owFniUz"/></svg>
  </div>
  <h1 data-page-node-id="PakFn5mYRzCDSKtb4Pwd6c">DeepSeek Harness <span id="version" data-page-node-id="sh9RHtvOeYkTYjhLH5eV0S">v0.1.5-rc.2</span></h1>
  <p class="status" id="status" data-page-node-id="DBPTZr1Fkvo8h8DWjd51Zg">正在启动服务...</p>
  <div class="spinner" id="spinner" data-page-node-id="w1sFjVmYzLw0Jo1LmDSIaP"></div>
  <p class="error" id="error" data-page-node-id="9QvTvRr6p0cm8GjS9hfRyP"></p>
  <p class="retry-hint" id="retry-hint" data-page-node-id="KpIAQt2zTxGUMTKIJdaHLd"></p>
</div>
<script>
  const TARGET = "http://127.0.0.1:3080";
  const POLL_MS = 1500;
  const MAX_ATTEMPTS = 80;      // 120s total
  const TOKEN_GRACE_MS = 20000; // keep waiting for credentials this long after the server answers
  let attempts = 0;
  let serverUpAt = 0;

  function status(msg) {
    document.getElementById("status").textContent = msg;
  }

  function showError(msg, retry) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("error").textContent = msg;
    document.getElementById("error").style.display = "block";
    if (retry) {
      document.getElementById("retry-hint").textContent = retry;
      document.getElementById("retry-hint").style.display = "block";
    }
  }

  // A file:// page may not fetch() or XHR a sibling file, but it may load one
  // as a <script>. The launcher rewrites token.js the moment DSH prints its
  // one-time URL, which is the only way the browser can clear the 401 on a
  // profile that has never authenticated before.
  function loadToken(done) {
    const s = document.createElement("script");
    s.src = "token.js?_=" + Date.now();
    s.onload = function () {
      s.remove();
      done(String(window.__DSH_TOKEN__ || "").trim());
    };
    s.onerror = function () {
      s.remove();
      done("");
    };
    (document.head || document.documentElement).appendChild(s);
  }

  function tick() {
    attempts++;
    var elapsed = Math.round(attempts * POLL_MS / 1000);
    loadToken(function (tok) {
      if (tok) {
        status("正在登录...");
        window.location.href = TARGET + "/?token=" + encodeURIComponent(tok);
        return;
      }
      // No token yet - probe the server so the status text can progress.
      fetch(TARGET, { mode: "no-cors", cache: "no-store" }).then(function () {
        if (!serverUpAt) {
          serverUpAt = Date.now();
          status("服务已就绪，正在获取登录凭据...");
        } else if (Date.now() - serverUpAt > TOKEN_GRACE_MS) {
          // No token arrived. A browser that already holds the auth cookie can
          // still open the plain URL, so try it rather than stalling forever.
          status("服务已就绪，正在进入应用...");
          window.location.href = TARGET;
          return;
        }
        setTimeout(tick, POLL_MS);
      }).catch(function () {
        if (attempts >= MAX_ATTEMPTS) {
          showError(
            "服务在 2 分钟内未能启动。",
            "请查看日志或重新启动应用。"
          );
          return;
        }
        // Elapsed seconds are shown from the very first tick so the user can
        // always tell the app is starting (perceived-progress requirement).
        if (attempts <= 10) {
          status("正在启动服务... (" + elapsed + "s)");
        } else if (attempts <= 20) {
          status("正在加载依赖... (" + elapsed + "s)");
        } else {
          status("即将就绪... (" + elapsed + "s)");
        }
        setTimeout(tick, POLL_MS);
      });
    });
  }

  setTimeout(tick, 1000);
</script>
</body>
